[workspace]
resolver = "2"
members = ["crates/ash-core", "crates/ash-cli", "apps/desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/your-org/audio-share-rs"

[workspace.dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
if-addrs = "0.13"
mdns-sd = "0.11"
cpal = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

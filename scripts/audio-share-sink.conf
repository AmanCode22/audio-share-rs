# PipeWire virtual sink for Audio Share Rust.
# Copy to ~/.config/pipewire/pipewire.conf.d/audio-share-sink.conf
# and run: systemctl --user restart pipewire
# Then: ashr serve --device "Audio Share Sink"
context.objects = [
    {   factory = adapter
        args = {
           factory.name     = support.null-audio-sink
           node.name        = "Audio Share Sink"
           media.class      = Audio/Sink
           object.linger    = true
           audio.position   = [ FL FR ]
           priority.session = 1009
           priority.driver  = 1009
           monitor.channel-volumes = true
           monitor.passthrough = true
        }
    }
]

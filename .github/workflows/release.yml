name: Release

# Triggered by pushing a version tag (e.g. `git push origin v1.0.0`) —
# builds every platform artifact and publishes a GitHub Release:
#   Windows     : ashr.exe (zip) + NSIS installer + MSI
#   Linux       : ashr (tar.gz) + deb + rpm + AppImage
#   macOS ARM64 : ashr (tar.gz) + DMG     (macos-latest)
#   macOS x64   : ashr (tar.gz) + DMG     (macos-15-intel)
#   Android     : release APK + AAB (signed when keystore secrets are present)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            bundles: "nsis,msi"
            archive: zip
          - label: linux-x64
            os: ubuntu-22.04
            bundles: "deb,rpm,appimage"
            archive: tar.gz
          - label: macos-arm64
            os: macos-latest
            bundles: "dmg"
            archive: tar.gz
          - label: macos-x64
            os: macos-15-intel
            bundles: "dmg"
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf libasound2-dev pkg-config file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build CLI
        run: cargo build --release -p ash-cli

      - name: Archive CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ashr.exe dist/
          Compress-Archive -Path dist/ashr.exe -DestinationPath audioshare-rs-cli-${{ matrix.label }}.zip

      - name: Archive CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ashr dist/
          tar czf audioshare-rs-cli-${{ matrix.label }}.tar.gz -C dist ashr
          shasum -a 256 audioshare-rs-cli-${{ matrix.label }}.tar.gz > audioshare-rs-cli-${{ matrix.label }}.tar.gz.sha256

      - name: Generate icons (icns/ico from app-icon.png)
        working-directory: apps/desktop
        run: cargo tauri icon app-icon.png

      - name: Build Tauri bundles
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect bundle artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi | ForEach-Object { Copy-Item $_.FullName dist/ }

      - name: Collect bundle artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist/ \;
          (command -v sha256sum >/dev/null && find dist -type f -exec sha256sum {} \; > dist/SHA256SUMS.txt) || true

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist/

  android:
    name: Android APK (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode signing keystore (optional)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "file=$(pwd)/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Collect APK + AAB
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/audioshare-rs-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/audioshare-rs-android.aab
          sha256sum dist/audioshare-rs-android.apk dist/audioshare-rs-android.aab > dist/SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-aab
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten layout
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.apk" -o -name "*.aab" -o -name "SHA256SUMS*.txt" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release/*

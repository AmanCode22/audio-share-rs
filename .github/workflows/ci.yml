name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/GTK dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (core + cli everywhere, desktop on non-Linux)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo clippy -p ash-core -p ash-cli --all-targets -- -D warnings
            # Desktop smoke-compiles on Linux too (GTK/WebKitGTK deps installed above).
            cargo check -p audioshare-companion
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi

      - name: Tests (unit + end-to-end loopback, release profile)
        run: cargo test --release -p ash-core -p ash-cli

      - name: Build CLI release binary
        run: cargo build --release -p ash-cli

  android:
    name: Android APK (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK (debug-signed when no keystore secrets)
        working-directory: android
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: audioshare-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk

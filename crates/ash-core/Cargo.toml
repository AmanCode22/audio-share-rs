[package]
name = "ash-core"
description = "Core engine for Audio Share Rust: wire protocol, audio capture, streaming server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audio"]
# Audio hardware backends (cpal capture/playback, WASAPI loopback on Windows).
# Disable for pure protocol/embedded builds: `--no-default-features`.
audio = ["dep:cpal"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
if-addrs.workspace = true
mdns-sd.workspace = true
cpal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
